name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: core AGENTS.md stays under 200 lines
        run: |
          lines=$(wc -l < AGENTS.md)
          echo "AGENTS.md: $lines lines (limit 200)"
          [ "$lines" -le 200 ]

      - name: core AGENTS.md names no framework, library, or non-baseline CLI
        run: |
          # Everything from the module index down is trigger text — that is where tool
          # names belong. gitleaks and commitlint are absent from the list on purpose:
          # both appear inside an explicit presence check, which CONTRIBUTING allows.
          core=$(sed '/^## On-demand rule modules/,$d' AGENTS.md | sed 's/<!--.*-->//')
          hits=$(printf '%s\n' "$core" | grep -nEio '\b(ripgrep|rg --no-ignore|npm|pnpm|yarn|npx|vitest|jest|playwright|prisma|drizzle|zod|eslint|prettier|biome|webpack|django|rails|pytest|ponytail)\b' || true)
          [ -z "$hits" ] || { echo "core names a tool outside a presence check:"; printf '%s\n' "$hits"; exit 1; }

      - name: ungated modules name stacks only under a specifics heading or as marked examples
        run: |
          # CONTRIBUTING's fourth stack-agnostic test, mechanized. Stack-gated
          # modules (trigger locks the whole file to the stack) are exempt, as is
          # dependencies.md — the cross-ecosystem exemplar where package-manager
          # names appear beside their siblings by design. In every other module a
          # blocklisted name may appear only below a "## <Stack> specifics"
          # heading, on the trigger line, or on a line marked as an example
          # (e.g. / or equivalent / a labeled "(Stripe" parenthetical). Curated
          # like the core blocklist: a name that belongs elsewhere joins the
          # exception filters here, never waved through.
          status=0
          exempt='containers|dependencies|git-hooks|iac|mobile|monorepo|nextjs|shell-scripts|web-seo'
          for f in rules/*.md; do
            base=$(basename "$f" .md)
            echo "$base" | grep -qE "^($exempt)$" && continue
            hits=$(sed 's/<!--.*-->//' "$f" \
              | sed '/^Read this when /d' \
              | awk '/^## /{insec = ($0 ~ /specifics$/)} !insec' \
              | grep -vE 'e\.g\.|equivalent|\(Stripe' \
              | grep -Eo '\b(Next\.js|Nuxt|React|Vue|Angular|Svelte|Zustand|Pinia|TanStack|SWR|Redis|Prisma|Drizzle|husky|lint-staged|Turborepo|Kubernetes|Dockerfile|Terraform|Pulumi|Vitest|Jest|Playwright|Express|Fastify|npm|pnpm|yarn|npx|Stripe|GitHub Actions)\b' || true)
            [ -z "$hits" ] || { echo "$f names a stack outside a specifics heading or a marked example:"; printf '%s\n' "$hits" | sed "s|^|  $f: |"; status=1; }
          done
          exit $status

      - name: every rules module is listed in the AGENTS.md module index
        run: |
          # Scoped to the index section: a module referenced only in the body of
          # AGENTS.md is still unlisted for a reader scanning the index.
          status=0
          index=$(sed -n '/^## On-demand rule modules/,$p' AGENTS.md)
          for f in rules/*.md; do
            printf '%s\n' "$index" | grep -qF "$f" || { echo "orphan: $f is not in the On-demand module index of AGENTS.md"; status=1; }
          done
          exit $status

      - name: every rules module opens with its trigger line
        run: |
          status=0
          for f in rules/*.md; do
            head -n 5 "$f" | grep -q '^Read this when ' || { echo "$f: missing 'Read this when' trigger line in the first 5 lines"; status=1; }
          done
          exit $status

      - name: llms.txt stays in sync with rules/
        run: |
          status=0
          for f in rules/*.md; do
            grep -qF "$f" llms.txt || { echo "missing from llms.txt: $f"; status=1; }
          done
          for f in $(grep -ohE 'rules/[a-z0-9-]+\.md' llms.txt | sort -u); do
            [ -f "$f" ] || { echo "stale llms.txt entry: $f"; status=1; }
          done
          exit $status

      - name: llms.txt links point at files that exist
        run: |
          # llms.txt uses absolute URLs by spec, so the markdown relative-link
          # gate never sees it; map each blob URL back to a repo path instead.
          status=0
          for p in $(grep -ohE 'blob/main/[^)]+' llms.txt | sed 's|^blob/main/||' | sort -u); do
            [ -f "$p" ] || { echo "llms.txt links to a missing file: $p"; status=1; }
          done
          exit $status

      - name: every referenced rules module exists
        run: |
          status=0
          for f in $(grep -ohE 'rules/[a-z0-9-]+\.md' $(git ls-files '*.md') | sort -u); do
            [ -f "$f" ] || { echo "dangling reference: $f"; status=1; }
          done
          exit $status

      - name: relative links resolve
        run: |
          status=0
          for src in $(git ls-files '*.md'); do
            dir=$(dirname "$src")
            for target in $(grep -ohE '\]\([^)]+\)' "$src" | sed 's/^](//; s/)$//; s/#.*$//'); do
              case "$target" in http*|mailto:*|'') continue ;; esac
              [ -e "$dir/$target" ] || { echo "$src: broken link -> $target"; status=1; }
            done
          done
          exit $status

      - name: code fences are balanced
        run: |
          status=0
          for f in $(git ls-files '*.md'); do
            n=$(grep -c '^```' "$f" || true)
            [ $((n % 2)) -eq 0 ] || { echo "$f: unbalanced code fences ($n)"; status=1; }
          done
          exit $status

      # The ruleset obeys the rule it publishes. The blocklist is read out of
      # rules/markdown.md rather than copied here, so adding a phrase there
      # extends this gate in the same edit and no second list can drift.
      # markdown.md itself is skipped: there the phrases are the list.
      - name: the repo's own prose obeys rules/markdown.md
        run: |
          python3 - <<'PY'
          import re, pathlib, subprocess, sys

          # Conditional entries a literal grep cannot decide: the bans that hold
          # only for the figurative sense, and "complete", which markdown.md
          # names as the recommended replacement. They stay review checks.
          # Curated like the blocklists above: a phrase joins this set only when
          # a grep genuinely cannot rule on it, never to wave a hit through.
          CONDITIONAL = {"navigate", "landscape", "realm", "leverage", "complete"}

          md = pathlib.Path("rules/markdown.md").read_text(encoding="utf-8")
          block = md.split("Avoid these patterns unless the document's house style requires them:")[1]
          phrases = []
          for line in block.splitlines():
              # The blocklist ends at the first prose line after it — the carve-out
              # block below it is bullets too, and its quoted text names phrases
              # rather than banning them.
              if not line.startswith("- "):
                  if line.strip():
                      break
                  continue
              phrases += [p for p in re.findall(r'"([^"]+)"', line)
                          if p.lower() not in CONDITIONAL and "X but also Y" not in p]
          if not phrases:
              raise SystemExit("no phrases parsed out of rules/markdown.md — the list moved or changed shape")

          # markdown.md exempts quoted examples and cited text, so the gate reads
          # prose only: source-citation comments, fences, inline code and quoted
          # spans are where a banned phrase is named rather than used.
          def prose(text):
              text = re.sub(r"<!--.*?-->", " ", text, flags=re.S)
              text = re.sub(r"```.*?```", " ", text, flags=re.S)
              text = re.sub(r"`[^`\n]*`", " ", text)
              text = re.sub(r"\"[^\"\n]*\"", " ", text)
              return text

          files = [f for f in subprocess.run(["git", "ls-files", "*.md"], capture_output=True,
                                             text=True).stdout.split() if f != "rules/markdown.md"]
          fail = []
          for f in files:
              for i, line in enumerate(prose(pathlib.Path(f).read_text(encoding="utf-8")).splitlines(), 1):
                  for p in phrases:
                      if re.search(rf"(?<!\w){re.escape(p)}", line, re.I):
                          fail.append(f"{f}:{i}: {p!r} is on this repo's own blocklist")
                  if re.search(r"not only\b.{0,80}?\bbut also\b", line, re.I):
                      fail.append(f"{f}:{i}: 'not only X but also Y' is on this repo's own blocklist")

          print("\n".join(fail) if fail
                else f"self-application OK ({len(files)} files, {len(phrases)} phrases)")
          sys.exit(1 if fail else 0)
          PY
