name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # Every check lives in the script so the pre-commit hook runs the same
      # code; a gate added here alone could pass locally and fail on the server.
      - name: the repository's gates
        run: python3 scripts/lint.py
